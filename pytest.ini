[pytest]
# Import paths of the simulator and tools, so that test modules need no sys.path set-up.
pythonpath = tests/integration sim tools/reference tools/calib tools/lane tools/cosim
markers =
    long: the 100 000-frame run (IT09); excluded by default, run with -m long
    cosim: runs the weapon firmware in Renode (IT10 re-recording); excluded by default, run with -m cosim
addopts = -m "not long and not cosim"
