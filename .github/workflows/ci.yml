name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"  # Mondays: also the 100 000-frame run (IT09)

# Layout: the repo is checked out to <workspace>/aimtrk-fw and is the west
# manifest repository (west.yml, self.path: aimtrk-fw); <workspace> is the west
# topdir that holds zephyr/ and modules/.
env:
  AIMTRK_WS: ${{ github.workspace }}
  AIMTRK_VENV: ${{ github.workspace }}/venv

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: aimtrk-fw

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git cmake ninja-build gperf ccache device-tree-compiler wget \
            python3-dev python3-venv xz-utils file make gcc gcc-multilib g++-multilib libmagic1

      - name: Python venv
        run: |
          python3 -m venv "$AIMTRK_VENV"
          "$AIMTRK_VENV/bin/pip" install -q --upgrade pip
          "$AIMTRK_VENV/bin/pip" install -q west -r aimtrk-fw/requirements.txt

      - name: Cache Zephyr and SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.west
            ${{ github.workspace }}/zephyr
            ${{ github.workspace }}/modules
            ~/zephyr-sdk-*
          key: zephyr-${{ hashFiles('aimtrk-fw/west.yml') }}-v1

      - name: West workspace and SDK
        run: |
          source "$AIMTRK_VENV/bin/activate"
          cd "$AIMTRK_WS"
          [ -d .west ] || west init -l aimtrk-fw
          west update -n -o=--depth=1
          west packages pip --install
          ls -d ~/zephyr-sdk-* >/dev/null 2>&1 || west sdk install -t arm-zephyr-eabi

      - name: Python lint
        run: |
          source "$AIMTRK_VENV/bin/activate"
          cd aimtrk-fw
          ruff check sim tools tests --line-length 120

      - name: "CAN protocol vectors current (protocol/tracker.dbc)"
        run: |
          source "$AIMTRK_VENV/bin/activate"
          python3 aimtrk-fw/protocol/gen_vectors.py --check

      - name: "Build aim_host (tracker service, -Werror)"
        run: make -C aimtrk-fw/host

      - name: "Reference lane: screen inside the frame (SPEC 2a)"
        run: |
          source "$AIMTRK_VENV/bin/activate"
          python3 aimtrk-fw/sim/camsim.py lane

      - name: "C vs NumPy and OpenCV cross-check, centroid accuracy curve (SPEC 9.2)"
        run: bash aimtrk-fw/scripts/crosscheck.sh --frames 40

      - name: Unit tests (ztest on native_sim) with coverage
        run: bash aimtrk-fw/scripts/test-unit.sh --coverage --coverage-tool gcovr --coverage-basedir "$AIMTRK_WS/aimtrk-fw"

      - name: "Coverage of aimtrk >= 90 % lines"
        run: |
          source "$AIMTRK_VENV/bin/activate"
          python3 - <<'EOF'
          import json, os
          d = json.load(open(os.path.join(os.environ["AIMTRK_WS"], "twister-out-aimtrk", "coverage_summary.json")))
          files = [f for f in d["files"] if f["filename"].startswith("aimtrk/")]
          cov = sum(f["line_covered"] for f in files) / sum(f["line_total"] for f in files)
          for f in files:
              print(f'{f["filename"]:28s} {f["line_percent"]:5.1f} %')
          print(f"aimtrk line coverage {100 * cov:.1f} %")
          assert cov >= 0.90, "below the 90 % target"
          EOF

      # IT11 runs aim_host live on SocketCAN. It needs the vcan module, which hosted runners may not
      # have: then this step says so and IT11 is skipped, not failed.
      - name: "Virtual CAN interface vcan0 for IT11 (if the runner's kernel has vcan)"
        run: |
          if sudo modprobe vcan 2>/dev/null || { sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 && sudo modprobe vcan; }; then
            sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0 && ip -details link show vcan0
          else
            echo "::notice::no vcan module on this runner: IT11 (SocketCAN) will be skipped"
          fi

      - name: "Integration tests IT01-IT08, IT10 (weapon firmware replay), IT11 (vcan) on rendered sequences (SPEC 9.3)"
        run: bash aimtrk-fw/scripts/test-it.sh -rs

      - name: "IT09: 100 000 frames, P03 and P05 (weekly and on demand)"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          source "$AIMTRK_VENV/bin/activate"
          cd aimtrk-fw
          python3 -m pytest tests/integration/test_it09_long_run.py -m long -v -p no:cacheprovider

      - name: "Demo session and lane view (SPEC 10)"
        run: |
          source "$AIMTRK_VENV/bin/activate"
          cd aimtrk-fw
          python3 tools/lane/demo_session.py --out build/session
          python3 tools/lane/lane_view.py build/session --png build/session/lane_view.png

      - name: Upload test reports and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            ${{ github.workspace }}/twister-out-aimtrk/coverage/
            ${{ github.workspace }}/twister-out-aimtrk/coverage_summary.json
            ${{ github.workspace }}/twister-out-aimtrk/twister.xml
            ${{ github.workspace }}/twister-out-aimtrk/twister.json
            aimtrk-fw/results/
            aimtrk-fw/build/aim_host
            aimtrk-fw/build/session/
          if-no-files-found: warn
